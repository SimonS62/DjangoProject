{% extends 'base.html' %}

{% block content %}
    <h1>Удаление товара</h1>
    <p>Вы уверены, что хотите удалить {{ object.name }}?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Да, удалить</button>
        <a href="{% url 'product_detail' object.pk %}">Отмена</a>
    </form>
{% endblock %}
